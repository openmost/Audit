# ---------- 3. CONFIG FILE ----------------------------------------------

  - id: cfg-force-ssl
    cat: config-file
    severity: critical
    methods: [cfg, diag]
    cfg: {section: General, key: force_ssl, expected: "1"}
    diag:
      field: "SSL connection forced"
      check_ok: true

  - id: cfg-trusted-hosts
    cat: config-file
    severity: high
    methods: [cfg]
    cfg: {section: General, key: "trusted_hosts[]"}

  - id: cfg-cors-domains
    cat: config-file
    severity: high
    methods: [cfg]
    cfg: {section: General, key: cors_domains, not_contains: "*"}
  - id: cfg-login-bruteforce
    cat: config-file
    severity: high
    methods: [cfg, mcp]
    cfg: {section: General, key: login_allowlist_ip}

  - id: cfg-password-complexity
    cat: config-file
    severity: medium
    methods: [cfg]
    cfg: {section: General, key: minimum_password_length}

  - id: cfg-enable-auto-update
    cat: config-file
    severity: low
    methods: [diag, cfg]
    diag:
      field: "Auto Update Enabled"
      expected: "1"
    cfg: {section: General, key: enable_auto_update, expected: "0"}
  - id: cfg-multi-server-environment
    cat: config-file
    severity: high
    methods: [diag, cfg]
    diag:
      field: "Multi Server Environment"
      expected: "0"

  - id: cfg-unique-visitors-range
    cat: config-file
    severity: medium
    methods: [cfg]
    cfg: {section: General, key: enable_processing_unique_visitors_range, expected: "0"}

  - id: cfg-unique-visitors-year
    cat: config-file
    severity: medium
    methods: [cfg]
    cfg: {section: General, key: enable_processing_unique_visitors_year, expected: "0"}

  - id: cfg-custom-reports-max-dimensions
    cat: config-file
    severity: low
    methods: [cfg]
    cfg: {section: CustomReports, key: custom_reports_max_dimensions}

  - id: cfg-mariadb-schema
    cat: config-file
    severity: medium
    methods: [cfg]
    cfg: {section: database, key: schema}

